
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRP - Mapa gangów</title>
    <link rel="icon" type="image/png" href="https://myrp.pl/favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0fa8d2; 
            overflow: hidden;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3b3b3b 0%, #505052 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .spinner-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .loading-logo {
            width: 110px;
            height: auto;
            animation: spin 3s infinite linear;
            filter: drop-shadow(0 0 15px rgba(236, 236, 236, 0.6));
        }
        .spinner-ring {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 3px solid transparent;
            border-top: 3px solid #727272;
            border-bottom: 3px solid #535353;
            border-radius: 50%;
            animation: pulse-ring 1.8s infinite ease-in-out;
        }
        .loading-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(61, 61, 61, 0.5);
            animation: pulse-text 1.5s infinite alternate;
        }
        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9) rotate(0deg); opacity: 0.5; }
            50% { transform: scale(1.1) rotate(180deg); opacity: 1; }
            100% { transform: scale(0.9) rotate(360deg); opacity: 0.5; }
        }

        @keyframes pulse-text {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .leaflet-top.leaflet-left {
            top: 20px !important;
            left: 20px !important;
        }
        .leaflet-control-zoom {
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 8px !important;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8) !important;
            display: flex;
            flex-direction: column;
            gap: 0 !important;
        }
        .leaflet-control-zoom a {
            background: rgba(10, 10, 12, 0.95) !important;
            color: #ffffff !important;
            border: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 0 !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 18px !important;
            transition: all 0.2s ease;
        }
        .leaflet-control-zoom a:last-child {
            border-bottom: none !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(255, 42, 42, 0.85) !important;
            color: #fff !important;
        }
        .info-bottom-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            padding: 14px 22px;
            background: rgba(8, 8, 10, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 42, 42, 0.3);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .sidebar {
            position: absolute;
            top: 0;                             /* Zmieniono z 80px na 0 */
            right: -420px;
            width: 380px;
            height: 100%;                       /* Zmieniono z calc(100% - 80px) na 100% */
            z-index: 1001;
            background: rgba(8, 8, 10, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.9);
            padding: 30px 25px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow-y: auto;
        }
        .sidebar.active {
            right: 0;
        }
        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .sidebar-close:hover {
            color: #ff2a2a;
        }
        .sidebar-title {
            font-size: 22px;
            font-weight: 700;
            color: #ff2a2a;
            border-bottom: 2px solid rgba(255, 42, 42, 0.3);
            padding-bottom: 10px;
            margin-top: 10px;
        }
        .stats-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }
        .stat-item2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }
        .stat-item i {
            color: #ff2a2a;
            width: 18px;
            text-align: center;
        }
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
        }
        .info-section p {
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .btn-apply {
            position: relative;
            margin-top: auto;
            padding: 16px 20px;
            background: linear-gradient(135deg, #ff2a2a, #990000);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.3);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-apply::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }
        .leaflet-tile {
            outline: 1px solid transparent;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .leaflet-container {
            background: #0fa8d2 !important;
        }
        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 42, 0.6);
            background: linear-gradient(135deg, #ff4747, #cc0000);
        }
        .btn-apply:hover::before {
            left: 100%;
        }
        .zone-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }
        .zone-label-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            user-select: none;
        }
        .zone-label-title {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.9), 0px 0px 2px rgba(0, 0, 0, 1);
            margin-bottom: 4px;
            white-space: nowrap;
        }
        .zone-label-pill {
            background: rgba(20, 20, 22, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 3px 12px;
            border-radius: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .zone-label-pill i {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
        }
        .leaflet-tile-container img {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner-container">
            <div class="spinner-ring"></div>
            <img src="https://bbhkubus.pl/myrphood.png" alt="Logo Gang" class="loading-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/843/843272.png'">
        </div>
        <div class="loading-text">Ładowanie mapy...</div>
    </div>

    <div class="info-bottom-left">
        <i class="fa-solid fa-circle-info" style="color: #ff2a2a;"></i>
        <span>Kliknij w strefę, aby zobaczyć szczegóły i informacje o danym terytorium.</span>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="sidebar-title" id="zoneName">Nazwa Strefy</h2>
        
        <div class="stats-box">
            <div class="stat-item">
                <i class="fa-solid fa-users"></i>
                <span>Zajęte sety: <strong id="zoneMembers">0 / 0</strong></span>
            </div>
            <div class="stat-item2">
                <span>Dostępne miejsca na set gangu w wybranym sektorze.</span>
            </div>
        </div>
        <a href="https://discord.gg/myrphood/" target="_blank" class="btn-apply">
            <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i> Złóż podanie
        </a>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    const loadingScreen = document.getElementById('loading-screen');
    function hideLoadingScreen() {
        if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
            loadingScreen.classList.add('hidden');
        }
    }
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: 3,
        maxZoom: 7,
        zoomDelta: 0.5,
        zoomSnap: 0.5,
        zoomControl: true,
        attributionControl: false
    });
    map.whenReady(() => {
        setTimeout(hideLoadingScreen, 600);
    });
    setTimeout(hideLoadingScreen, 1200);
    L.TileLayer.Gta = L.TileLayer.extend({
        getTileUrl: function(coords) {
            return `https://bbhkubus.pl/gta-v/tiles/atlas/${coords.z}-${coords.x}_${coords.y}.png`;
        }
    });
    L.tileLayer.gta = function(options) {
        return new L.TileLayer.Gta('', options);
    };
    const mapSize = 32768; 
    const southWest = map.unproject([0, mapSize], 7);
    const northEast = map.unproject([mapSize, 0], 7);
    const bounds = L.latLngBounds(southWest, northEast);
    L.tileLayer.gta({
        tileSize: 256,
        noWrap: true,
        maxNativeZoom: 7,
        minNativeZoom: 0,
        maxZoom: 9,
        minZoom: 1,
        bounds: bounds
    }).addTo(map);
    map.setView([-45, 45], 4); 
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    function addZone(config) {
        const polygon = L.polygon(config.coords, {
            color: '#ff2a2a',
            weight: 2,
            fillColor: '#ff0000',
            fillOpacity: 0.35,
            smoothFactor: 2.0
        }).addTo(map);

        polygon.on('mouseover', function () { this.setStyle({ fillOpacity: 0.6, weight: 3 }); });
        polygon.on('mouseout', function () { this.setStyle({ fillOpacity: 0.35, weight: 2 }); });

        const center = polygon.getBounds().getCenter();
        L.tooltip({ permanent: true, direction: 'center', className: 'zone-label' })
        .setContent(`
            <div class="zone-label-container">
                <div class="zone-label-title">${config.name}</div>
                <div class="zone-label-pill">${config.slots} <i class="fa-solid fa-users"></i></div>
            </div>
        `).setLatLng(center).addTo(map);

        polygon.on('click', function (e) {
            L.DomEvent.stopPropagation(e);
            document.getElementById('zoneName').innerText = config.name;
            document.getElementById('zoneMembers').innerText = config.slots;
            sidebar.classList.add('active');
        });

        return polygon;
    }
    addZone({
        name: "Hood Dusty Pines",
        slots: "0 / 2",
        coords: [[-35.86, 52.41], [-36.24, 52.07], [-36.59, 52.39], [-36.27, 52.85]],
        desc: "...",
        roleplay: "...",
        reqs: "..."
    });

    addZone({
        name: "Hood Mirror Park",
        slots: "0 / 1",
        coords: [[-62.56, 46.25], [-62.66, 46.27], [-63.04, 46.58], [-63.12, 46.72], [-63.14, 47.61], [-62.74, 47.57], [-62.32, 47.50], [-62.01, 47.41], [-61.58, 47.43], [-61.61, 46.90], [-61.68, 46.60], [-62.44, 46.46], [-62.56, 46.27]],
        desc: "...",
        roleplay: "...",
        reqs: "..."
    });
    addZone({
        name: "Hood El Molino",
        slots: "0 / 3",
        coords: [[-72.14, 39.86], [-72.23, 39.89], [-73.15, 39.89], [-73.22, 39.98], [-73.40, 40.00], [-73.40, 40.09], [-73.52, 40.75], [-73.58, 40.95], [-73.52, 40.97], [-73.47, 41.18], [-73.43, 41.53], [-73.43, 41.71], [-73.50, 41.75], [-73.05, 41.83], [-73.01, 41.69], [-72.88, 41.53], [-72.48, 41.09], [-72.20, 40.75], [-72.15, 40.55]],
        desc: "...",
        roleplay: "...",
        reqs: "..."
    });

    addZone({
        name: "Hood Barrio Del Este",
        slots: "0 / 5",
        coords: [[-67.99, 47.00], [-68.66, 47.00], [-68.95, 47.05], [-69.18, 47.10], [-69.74, 47.32], [-69.59, 47.70], [-69.41, 48.05], [-69.10, 48.51], [-68.80, 48.31], [-68.51, 48.21], [-67.95, 48.02], [-67.96, 47.00]],
        desc: "...",
        roleplay: "...",
        reqs: "..."
    });

    addZone({
        name: "Hood San Fernando",
        slots: "0 / 10",
        coords: [[-70.16, 45.28], [-70.42, 45.26], [-70.91, 45.16], [-71.34, 45.07], [-71.84, 44.98], [-72.15, 44.96], [-72.22, 45.79], [-70.21, 45.95]],
        desc: "...",
        roleplay: "...",
        reqs: "..."
    });
    sidebarClose.addEventListener('click', function() {
        sidebar.classList.remove('active');
    });
    map.on('click', function(e) {
        sidebar.classList.remove('active');
        console.log(`[${e.latlng.lat.toFixed(2)}, ${e.latlng.lng.toFixed(2)}],`);
    });
    window.addEventListener('resize', function() {
        map.invalidateSize();
    });
    </script>
</body>
</html>
